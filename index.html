<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pelukciumfirst - Personal Website</title>
    
    <!-- Favicon Minecraft Grass Block -->
    <link rel="icon" type="image/png" href="https://minecraft.wiki/images/Grass_Block_JE8_BE6.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Press Start 2P & VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }
        .font-vt {
            font-family: 'VT323', monospace;
        }

        /* Tema Background Nuansa Hijau Gelap Ala Server Survival / Eternal SMP */
        body {
            background-color: #0b130b;
            background-image: 
                radial-gradient(circle, rgba(45, 106, 79, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #d1d5db;
        }

        /* Kotak UI ala Kotak Inventaris / UI Minecraft dengan Border Hijau */
        .mc-box {
            background-color: #132216;
            border: 4px solid #1e3f20;
            box-shadow: inset -4px -4px 0px #0b130b, inset 4px 4px 0px #2d6a4f;
            border-radius: 0px;
        }

        .mc-button {
            background-color: #1b4332;
            border: 3px solid #0d2318;
            box-shadow: inset -3px -3px 0px #112a1d, inset 3px 3px 0px #40916c;
            transition: all 0.1s ease;
        }

        .mc-button:hover {
            background-color: #2d6a4f;
            box-shadow: inset -3px -3px 0px #1b4332, inset 3px 3px 0px #52b788;
        }

        .mc-button:active {
            box-shadow: inset 3px 3px 0px #0d2318;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8">

    <!-- Audio Efek Klik Button -->
    <audio id="mc-click-sound" src="https://www.myinstants.com/media/sounds/minecraft-click.mp3" preload="auto"></audio>

    <!-- Header / Banner -->
    <header class="w-full max-w-2xl text-center mb-6">
        <div class="mc-box p-3 inline-block mb-3">
            <span class="text-xs font-pixel text-emerald-400 tracking-wider">[ PERSONAL_PROFILE ]</span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-pixel text-white tracking-widest drop-shadow-[0_4px_0_#092011]">
            PELUKCIUMFIRST
        </h1>
    </header>

    <!-- Konten Utama (Tab Socials & Profile) -->
    <main class="w-full flex justify-center mb-6">
        <div id="socials" class="tab-content w-full max-w-2xl mc-box p-6 sm:p-8">
            
            <!-- Badge Connect -->
            <div class="flex justify-between items-center mb-6">
                <span class="inline-block px-3 py-1 text-xs font-pixel text-emerald-300 bg-[#0d2318] border-2 border-[#52b788] uppercase">
                    Connect With Me
                </span>
                <span class="text-xs font-vt text-emerald-500 text-2xl">EST. 2026</span>
            </div>

            <h2 class="text-2xl sm:text-3xl font-pixel text-white mb-6 border-b-4 border-[#1b4332] pb-3">
                Social Links
            </h2>
            
            <!-- Grid Sosial Media -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- Saweria -->
                <a href="https://saweria.co/sortamenfy" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group sm:col-span-2">
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-heart text-amber-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">Saweria (Support Me)</span>
                    </div>
                    <span class="text-xs px-3 py-1 bg-[#132216] border border-amber-500 text-amber-300 font-pixel">SUPPORT</span>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/channel/UCMfAgJBOWTUq_QKq5dFEsww" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-youtube text-red-500 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">YouTube</span>
                    </div>
                    <img src="https://img.shields.io/youtube/channel/subscribers/UCMfAgJBOWTUq_QKq5dFEsww?style=flat-square&color=FF0000&label=Subs&labelColor=0d2318" alt="YouTube Subs" class="h-5 opacity-90 border border-red-500">
                </a>

                <!-- Discord -->
                <a href="https://discord.gg/Fw9weRr7c" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-discord text-indigo-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">Discord</span>
                    </div>
                    <img src="https://img.shields.io/discord/1510954608208384120?style=flat-square&color=5865F2&label=Online&labelColor=0d2318" alt="Discord Online" class="h-5 opacity-90 border border-indigo-500">
                </a>

                <!-- TikTok -->
                <a href="https://www.tiktok.com/@zerrydep" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-tiktok text-cyan-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">TikTok</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 bg-[#0d2318] border border-cyan-500 text-cyan-300 font-mono">@zerrydep</span>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/zerry3312/" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-instagram text-pink-500 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">Instagram</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 bg-[#0d2318] border border-pink-500 text-pink-300 font-mono">@zerry3312</span>
                </a>

                <!-- X (Twitter) -->
                <a href="https://x.com/Qin_Zenn" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 sm:col-span-2 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-x-twitter text-sky-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">X (Twitter)</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 bg-[#0d2318] border border-sky-500 text-sky-300 font-mono">@Qin_Zenn</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs font-vt text-emerald-600 text-xl">
        <p>&copy; 2026 pelukciumfirst. Built with grass & code.</p>
    </footer>

    <!-- JavaScript Efek Suara -->
    <script>
        const clickSound = document.getElementById('mc-click-sound');
        
        document.querySelectorAll('.sound-btn').forEach(button => {
            button.addEventListener('click', () => {
                if(clickSound) {
                    clickSound.currentTime = 0;
                    clickSound.play().catch(e => console.log("Audio blocked by browser policy"));
                }
            });
        });
    </script>
</body>
</html>
