<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pelukciumfirst - Minecraft Personal Website</title>
    
    <!-- Favicon Minecraft Style -->
    <link rel="icon" type="image/png" href="https://minecraft.wiki/images/Grass_Block_JE8_BE6.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Press Start 2P (Pixel Font Ala Minecraft) & VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        /* Menerapkan font gaya pixel / terminal */
        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }
        .font-vt {
            font-family: 'VT323', monospace;
        }

        /* Tema Background Ala Minecraft Dirt/Stone Background dengan Efek Gelap */
        body {
            background-color: #111111;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #d1d5db;
        }

        /* Kotak UI ala Kotak Inventaris / UI Minecraft */
        .mc-box {
            background-color: #2b2b2b;
            border: 4px solid #373737;
            box-shadow: inset -4px -4px 0px #1e1e1e, inset 4px 4px 0px #484848;
            border-radius: 0px; /* Bentuk kotak tajam ala game klasik */
        }

        .mc-button {
            background-color: #585858;
            border: 3px solid #222222;
            box-shadow: inset -3px -3px 0px #383838, inset 3px 3px 0px #787878;
            transition: all 0.1s ease;
        }

        .mc-button:hover {
            background-color: #6a6a6a;
            box-shadow: inset -3px -3px 0px #484848, inset 3px 3px 0px #8a8a8a;
        }

        .mc-button:active {
            box-shadow: inset 3px 3px 0px #222222;
        }

        /* Input form kotak pixel */
        .mc-input {
            background-color: #1a1a1a;
            border: 3px solid #333333;
            box-shadow: inset 2px 2px 0px #0a0a0a;
            border-radius: 0px;
        }
        .mc-input:focus {
            border-color: #55ff55;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8">

    <!-- Audio Efek Klik Button (Suara Kayu/UI Minecraft) -->
    <audio id="mc-click-sound" src="https://www.myinstants.com/media/sounds/minecraft-click.mp3" preload="auto"></audio>

    <!-- Header / Banner Ala Game Menu -->
    <header class="w-full max-w-2xl text-center mb-6">
        <div class="mc-box p-4 inline-block mb-2">
            <span class="text-xs font-pixel text-yellow-400 tracking-wider">MINECRAFT SERVER OWNER & DEVELOPER</span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-pixel text-white tracking-widest drop-shadow-[0_4px_0_#000]">
            PELUKCIUMFIRST
        </h1>
    </header>

    <!-- Konten Utama (Tab Socials & Contact) -->
    <main class="w-full flex justify-center mb-6">
        <div id="socials" class="tab-content w-full max-w-2xl mc-box p-6 sm:p-8">
            
            <!-- Badge Connect -->
            <div class="flex justify-between items-center mb-6">
                <span class="inline-block px-3 py-1 text-xs font-pixel text-emerald-300 bg-emerald-950 border-2 border-emerald-500 uppercase">
                    [ CONNECT_MENU ]
                </span>
                <span class="text-xs font-vt text-zinc-400 text-2xl">v1.20.4_survival</span>
            </div>

            <h2 class="text-2xl sm:text-3xl font-pixel text-white mb-6 border-b-4 border-zinc-700 pb-3">
                Social Links & Contact
            </h2>
            
            <!-- Grid Sosial Media -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                
                <!-- Saweria -->
                <a href="https://saweria.co/sortamenfy" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group sm:col-span-2">
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-heart text-amber-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">Saweria (Support Me)</span>
                    </div>
                    <span class="text-xs px-3 py-1 bg-amber-950 border border-amber-500 text-amber-300 font-pixel">SUPPORT</span>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/channel/UCMfAgJBOWTUq_QKq5dFEsww" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-youtube text-red-500 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">YouTube</span>
                    </div>
                    <img src="https://img.shields.io/youtube/channel/subscribers/UCMfAgJBOWTUq_QKq5dFEsww?style=flat-square&color=FF0000&label=Subs&labelColor=1e293b" alt="YouTube Subs" class="h-5 opacity-90 border border-red-500">
                </a>

                <!-- Discord -->
                <a href="https://discord.gg/Fw9weRr7c" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-discord text-indigo-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">Discord</span>
                    </div>
                    <img src="https://img.shields.io/discord/1510954608208384120?style=flat-square&color=5865F2&label=Online&labelColor=1e293b" alt="Discord Online" class="h-5 opacity-90 border border-indigo-500">
                </a>

                <!-- TikTok -->
                <a href="https://www.tiktok.com/@zerrydep" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-tiktok text-cyan-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">TikTok</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 bg-black border border-cyan-500 text-cyan-300 font-mono">@zerrydep</span>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/zerry3312/" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-instagram text-pink-500 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">Instagram</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 bg-black border border-pink-500 text-pink-300 font-mono">@zerry3312</span>
                </a>

                <!-- X (Twitter) -->
                <a href="https://x.com/Qin_Zenn" target="_blank" rel="noopener noreferrer" class="sound-btn mc-button flex items-center justify-between p-4 text-slate-200 sm:col-span-2 group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-x-twitter text-sky-400 text-2xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-semibold text-base font-vt text-2xl">X (Twitter)</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 bg-black border border-sky-500 text-sky-300 font-mono">@Qin_Zenn</span>
                </a>
            </div>

            <!-- Quick Message Form Ala Kotak Buku Pesan -->
            <div class="p-5 mc-box bg-[#1e1e1e]">
                <h3 class="text-lg font-pixel text-yellow-300 mb-4 flex items-center gap-2 text-sm">
                    <i class="fa-regular fa-paper-plane text-emerald-400"></i> Kirim Pesan Cepat
                </h3>
                <form onsubmit="handleContactSubmit(event)" class="space-y-4">
                    <input type="text" id="contact-name" placeholder="Nama / Username kamu" required class="w-full px-4 py-3 mc-input text-white font-vt text-xl placeholder-zinc-500">
                    <textarea id="contact-message" rows="3" placeholder="Pesan kamu..." required class="w-full px-4 py-3 mc-input text-white font-vt text-xl placeholder-zinc-500"></textarea>
                    <button type="submit" class="sound-btn w-full py-3 mc-button bg-[#3c8527] hover:bg-[#4ea235] text-white font-pixel text-xs tracking-wider border-emerald-700">
                        [ KIRIM PESAN ]
                    </button>
                </form>
                <p id="contact-status" class="text-xs font-pixel text-emerald-400 mt-3 hidden"></p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs font-vt text-zinc-500 text-xl">
        <p>&copy; 2026 pelukciumfirst. All blocks reserved.</p>
    </footer>

    <!-- JavaScript Interaktif & Audio Efek -->
    <script>
        // Fungsi untuk memainkan efek suara klik Minecraft setiap tombol ditekan
        const clickSound = document.getElementById('mc-click-sound');
        
        document.querySelectorAll('.sound-btn').forEach(button => {
            button.addEventListener('click', () => {
                if(clickSound) {
                    clickSound.currentTime = 0;
                    clickSound.play().catch(e => console.log("Audio blocked by browser policy"));
                }
            });
        });

        // Handler untuk Form Kontak Cepat
        function handleContactSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('contact-name').value;
            const message = document.getElementById('contact-message').value;
            const status = document.getElementById('contact-status');

            // Simulasi pengiriman pesan berhasil
            status.textContent = `> Pesan dari ${name} berhasil dikirim ke server!`;
            status.classList.remove('hidden');

            // Reset Form
            document.getElementById('contact-name').value = '';
            document.getElementById('contact-message').value = '';

            setTimeout(() => {
                status.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
