<div id="discord-status" class="card discord-card" style="text-align: center;">
    <i class="fa-brands fa-discord" style="font-size: 3rem; color: #5865F2; margin-bottom: 20px;"></i>
    <h3>Discord Status</h3>
    <p id="status-text">Memuat status...</p>
</div>

<script>
    async function checkDiscordStatus() {
        try {
            let response = await fetch('https://api.lanyard.rest/v1/users/1006821519395131392');
            let data = await response.json();
            
            if (data.success) {
                let discordStatus = data.data.discord_status; // online, idle, dnd, offline
                let statusTextElem = document.getElementById('status-text');
                
                // Ubah teks status sesuai kondisi
                if (discordStatus === 'online') {
                    statusTextElem.innerHTML = '<span style="color: #22c55e; font-weight: 600;">Online</span> di Discord';
                } else if (discordStatus === 'idle') {
                    statusTextElem.innerHTML = '<span style="color: #eab308; font-weight: 600;">Idle</span> (Sedang Berwarna Kuning)';
                } else if (discordStatus === 'dnd') {
                    statusTextElem.innerHTML = '<span style="color: #ef4444; font-weight: 600;">Do Not Disturb</span> (Jangan Ganggu)';
                } else {
                    statusTextElem.innerHTML = '<span style="color: #64748b; font-weight: 600;">Offline</span> atau Invisible';
                }
            }
        } catch (error) {
            document.getElementById('status-text').innerText = 'Gagal memuat status Discord.';
        }
    }

    // Jalankan saat website dibuka
    checkDiscordStatus();
    
    // Perbarui status tiap 10 detik
    setInterval(checkDiscordStatus, 10000);
</script>
