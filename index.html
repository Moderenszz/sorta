<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Modern</title>
    <!-- Framework Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">MyBrand</h1>
        <nav class="space-x-4">
            <a href="#" class="hover:text-indigo-400 transition">Beranda</a>
            <a href="#" class="hover:text-indigo-400 transition">Fitur</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto text-center px-4 py-16">
        <h2 class="text-4xl font-extrabold text-white mb-4">
            Tampilan Modern Tanpa Ribet
        </h2>
        <p class="text-slate-400 text-lg mb-8">
            Website ini menggunakan framework CSS modern. Kamu bisa bikin tombol dengan efek animasi hanya dalam beberapa kata.
        </p>

        <!-- Variasi Tombol Bagus -->
        <div class="flex flex-wrap justify-center gap-4">
            <!-- Tombol Utama dengan Efek Glow & Hover -->
            <button class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-indigo-500/30 transition-all duration-200 active:scale-95">
                Mulai Sekarang
            </button>

            <!-- Tombol Sekunder Outline -->
            <button class="border border-slate-600 hover:border-slate-400 text-slate-200 font-semibold py-3 px-6 rounded-xl transition-all duration-200 active:scale-95">
                Pelajari Lebih Lanjut
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-slate-800 text-slate-500 text-sm">
        &copy; 2026 Website Modern.
    </footer>

</body>
</html>
