<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Kotak Login Form -->
    <div id="login-container" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md hidden">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-2xl mb-3 text-2xl font-bold">🔐</div>
            <h1 class="text-2xl font-bold">Admin Login</h1>
            <p class="text-slate-400 text-sm mt-1">Masukkan akses untuk mengontrol server.</p>
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <p id="error-msg" class="text-rose-500 text-xs text-center hidden">Username atau password salah!</p>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-900/20">Masuk Panel</button>
        </form>
    </div>

    <!-- Kotak Panel Kontrol (Tampil setelah login sukses) -->
    <div id="panel-container" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold flex items-center gap-2">🎮 Minecraft Panel</h1>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full text-xs font-medium">
                    <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="status-text" class="text-slate-300">Checking...</span>
                </div>
                <button onclick="handleLogout()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-3 py-1.5 rounded-lg transition border border-rose-500/20">Logout</button>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Pinggy TCP Address</p>
                <div class="flex items-center justify-between gap-2">
                    <code id="ip-address" class="text-sm font-mono text-emerald-400 truncate">Memuat alamat...</code>
                    <button onclick="copyIP()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition text-slate-300">Salin</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="controlServer('start')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-900/20 active:scale-95">Nyalakan Server</button>
                <button onclick="controlServer('stop')" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-rose-900/20 active:scale-95">Matikan Server</button>
            </div>
        </div>
    </div>

    <script>
        // URL Backend Codespaces kamu
        const BACKEND_URL = "https://automatic-lamp-v69jxjq6w5j4cxw-5000.app.github.dev"; 

        async function checkAuthAndStatus() {
            try {
                let authRes = await fetch(`${BACKEND_URL}/check-auth`, { credentials: 'include' });
                if (!authRes.ok) {
                    document.getElementById('login-container').classList.remove('hidden');
                    return;
                }
                
                document.getElementById('panel-container').classList.remove('hidden');
                
                let res = await fetch(`${BACKEND_URL}/status`, { credentials: 'include' });
                let data = await res.json();
                
                let dot = document.getElementById('status-dot');
                let text = document.getElementById('status-text');
                
                if (data.running) {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                    text.innerText = "ONLINE";
                } else {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                    text.innerText = "OFFLINE";
                }
                
                document.getElementById('ip-address').innerText = data.ip;
            } catch (e) {
                document.getElementById('login-container').classList.remove('hidden');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let errorMsg = document.getElementById('error-msg');

            try {
                let res = await fetch(`${BACKEND_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                let data = await res.json();
                if (data.success) {
                    errorMsg.classList.add('hidden');
                    document.getElementById('login-container').classList.add('hidden');
                    checkAuthAndStatus();
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } catch (e) {
                errorMsg.innerText = "Gagal terhubung ke server backend!";
                errorMsg.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            await fetch(`${BACKEND_URL}/logout`, { method: 'POST', credentials: 'include' });
            document.getElementById('panel-container').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
        }

        async function controlServer(action) {
            await fetch(`${BACKEND_URL}/${action}`, { method: 'POST', credentials: 'include' });
            setTimeout(checkAuthAndStatus, 1500);
        }

        function copyIP() {
            let ipText = document.getElementById('ip-address').innerText;
            navigator.clipboard.writeText(ipText);
            alert("IP server berhasil disalin!");
        }

        setInterval(() => {
            if (!document.getElementById('panel-container').classList.contains('hidden')) {
                checkAuthAndStatus();
            }
        }, 4000);

        checkAuthAndStatus();
    </script>
</body>
</html>
