<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Panel Minecraft Luar</title>
</head>
<body>
    <h1>Kontrol Minecraft dari Luar Codespaces</h1>
    <p>Status: <span id="status">Memuat...</span></p>
    <p>IP Pinggy: <span id="ip">-</span></p>
    
    <button onclick="controlServer('start')">Nyalakan</button>
    <button onclick="controlServer('stop')">Matikan</button>

    <script>
        // Ganti URL ini dengan URL Public Port 5000 dari GitHub Codespaces kamu
        const BACKEND_URL = "https://port-5000-app.app.github.dev"; 

        async function updateStatus() {
            try {
                let res = await fetch(`${BACKEND_URL}/status`);
                let data = await res.json();
                document.getElementById('status').innerText = data.running ? "ONLINE" : "OFFLINE";
                document.getElementById('ip').innerText = data.ip;
            } catch (e) {
                document.getElementById('status').innerText = "Gagal terhubung ke Codespaces";
            }
        }

        async function controlServer(action) {
            await fetch(`${BACKEND_URL}/${action}`, { method: 'POST' });
            setTimeout(updateStatus, 1000);
        }

        setInterval(updateStatus, 3000);
        updateStatus();
    </script>
</body>
</html>
