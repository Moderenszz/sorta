<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortamenfy | Personal Bio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 sm:p-8 bg-slate-950 overflow-x-hidden">

    <!-- 1. Background Gambar Full Screen + Overlay Gelap -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2000&q=80" 
             alt="Full Screen Background" 
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    </div>

    <!-- 2. Card Bio Utama -->
    <main class="relative z-10 w-full max-w-4xl bg-[#12232b]/90 rounded-3xl overflow-hidden shadow-2xl border border-slate-700/50 backdrop-blur-md">
        
        <!-- Header Banner Tipis -->
        <div class="h-32 sm:h-44 w-full relative overflow-hidden border-b border-slate-700/30">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80" 
                 alt="Header Banner" 
                 class="w-full h-full object-cover">
        </div>

        <!-- Konten Utama (Grid Kiri & Kanan) -->
        <div class="px-6 sm:px-10 py-8 relative">
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-end">
                
                <!-- Kolom Kiri: Nama & Deskripsi -->
                <div class="lg:col-span-7 relative">
                    
                    <!-- Nama & Bio -->
                    <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-wide">I'm Sortamenfy</h1>
                    <p class="text-slate-300 text-sm sm:text-base mt-3 leading-relaxed max-w-md italic">
                        "Dunia ku itu tidak berwarna karna semua yang akan aku katakan secara jujur akan melukai diri ku sendiri."
                    </p>

                    <!-- Social Icons -->
                    <div class="mt-6">
                        <p class="text-slate-400 text-xs font-semibold mb-2 uppercase tracking-wider">My Socials :</p>
                        <div class="flex items-center gap-4 text-xl text-slate-300">
                            <a href="https://www.youtube.com/@ZerryDeP" target="_blank" class="hover:text-red-500 transition-colors" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                            <a href="https://www.tiktok.com/@zerrydep" target="_blank" class="hover:text-cyan-400 transition-colors" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                            <a href="https://www.instagram.com/zerry3312/" target="_blank" class="hover:text-pink-500 transition-colors" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                            <a href="https://discord.gg/Fw9weRr7c" target="_blank" class="hover:text-indigo-400 transition-colors" title="Discord"><i class="fa-brands fa-discord"></i></a>
                            <a href="https://x.com/Qin_Zenn" target="_blank" class="hover:text-sky-400 transition-colors" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
                        </div>
                    </div>
                </div>

                <!-- Kolom Kanan: Tombol Kapsul -->
                <div class="lg:col-span-5 flex flex-col gap-3 justify-center pt-4 lg:pt-0">
                    <a href="https://www.youtube.com/@ZerryDeP" target="_blank" 
                       class="w-full bg-[#273a44]/90 hover:bg-[#344b58] text-slate-200 hover:text-white text-center font-medium py-3 rounded-full transition-all duration-200 border border-slate-600/40 shadow-lg">
                        YouTube Channel
                    </a>
                    
                    <a href="https://discord.gg/Fw9weRr7c" target="_blank" 
                       class="w-full bg-[#273a44]/90 hover:bg-[#344b58] text-slate-200 hover:text-white text-center font-medium py-3 rounded-full transition-all duration-200 border border-slate-600/40 shadow-lg">
                        Discord Community
                    </a>

                    <a href="https://www.tiktok.com/@zerrydep" target="_blank" 
                       class="w-full bg-[#273a44]/90 hover:bg-[#344b58] text-slate-200 hover:text-white text-center font-medium py-3 rounded-full transition-all duration-200 border border-slate-600/40 shadow-lg">
                        TikTok Profile
                    </a>

                    <a href="https://www.instagram.com/zerry3312/" target="_blank" 
                       class="w-full bg-[#273a44]/90 hover:bg-[#344b58] text-slate-200 hover:text-white text-center font-medium py-3 rounded-full transition-all duration-200 border border-slate-600/40 shadow-lg">
                        Instagram
                    </a>

                    <a href="https://x.com/Qin_Zenn" target="_blank" 
                       class="w-full bg-[#273a44]/90 hover:bg-[#344b58] text-slate-200 hover:text-white text-center font-medium py-3 rounded-full transition-all duration-200 border border-slate-600/40 shadow-lg">
                        X (Twitter)
                    </a>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
